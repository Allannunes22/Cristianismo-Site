  // Notícias adicionais 51-150
  { id: "news-051", title: "Papa Francisco Convoca Encontro Mundial de Jovens Católicos", excerpt: "Vaticano anuncia nova edição da Jornada Mundial da Juventude.", content: "O Papa Francisco anunciou a convocação de um grande encontro mundial de jovens católicos, reafirmando a importância da nova geração na missão da Igreja.", category: "CATÓLICO", date: "2026-04-25", author: "Equipe de Notícias", featured: false },
  { id: "news-052", title: "Conferência Episcopal Brasileira Debate Evangelização Digital", excerpt: "Bispos discutem estratégias para alcançar fiéis nas redes sociais.", content: "A Conferência Nacional dos Bispos do Brasil realizou um encontro especial para debater novas formas de evangelização por meio das plataformas digitais.", category: "CATÓLICO", date: "2026-04-24", author: "Equipe de Notícias", featured: false },
  { id: "news-053", title: "Santuário de Aparecida Recebe Recorde de Peregrinos", excerpt: "Basílica registra maior número de visitantes em sua história recente.", content: "O Santuário Nacional de Nossa Senhora Aparecida registrou um número recorde de peregrinos durante o feriado prolongado, com filas de até seis horas para a visita à imagem.", category: "CATÓLICO", date: "2026-04-23", author: "Equipe de Notícias", featured: false },
  { id: "news-054", title: "Novo Cardeal Brasileiro É Nomeado pelo Vaticano", excerpt: "Arcebispo de São Paulo recebe a púrpura cardinalícia.", content: "O arcebispo de São Paulo foi nomeado cardeal pelo Papa Francisco durante o consistório realizado em Roma, fortalecendo a representação brasileira no Colégio Cardinalício.", category: "CATÓLICO", date: "2026-04-22", author: "Equipe de Notícias", featured: false },
  { id: "news-055", title: "Diocese Lança Programa de Formação para Diáconos Permanentes", excerpt: "Igreja Católica amplia o diaconato permanente no Brasil.", content: "A Diocese de Campinas anunciou um novo programa de formação para diáconos permanentes, visando ampliar o serviço pastoral nas paróquias com carência de sacerdotes.", category: "CATÓLICO", date: "2026-04-21", author: "Equipe de Notícias", featured: false },
  { id: "news-056", title: "Carmelitas Abrem Novo Mosteiro no Nordeste Brasileiro", excerpt: "Ordem religiosa expande presença no interior do país.", content: "A Ordem dos Carmelitas inaugurou um novo mosteiro no sertão nordestino, com foco na vida contemplativa e no apoio às comunidades rurais da região.", category: "CATÓLICO", date: "2026-04-20", author: "Equipe de Notícias", featured: false },
  { id: "news-057", title: "Semana da Bíblia Católica Reúne Milhares em Todo Brasil", excerpt: "Iniciativa promove a leitura e meditação das Escrituras Sagradas.", content: "A Semana da Bíblia Católica reuniu milhares de fiéis em grupos de leitura e celebrações em todo o território nacional, promovendo a cultura bíblica entre os católicos.", category: "CATÓLICO", date: "2026-04-19", author: "Equipe de Notícias", featured: false },
  { id: "news-058", title: "Pontifícia Universidade Católica Abre Cursos de Teologia Online", excerpt: "PUC expande acesso à formação teológica por plataformas digitais.", content: "A Pontifícia Universidade Católica do Rio de Janeiro anunciou a abertura de novos cursos de teologia totalmente online, democratizando o acesso à formação acadêmica religiosa.", category: "CATÓLICO", date: "2026-04-18", author: "Equipe de Notícias", featured: false },
  { id: "news-059", title: "Missão Salesiana Celebra 150 Anos de Presença no Brasil", excerpt: "Congregação comemora século e meio de educação e evangelização.", content: "Os Salesianos celebraram 150 anos de missão educacional e evangelizadora no Brasil, com eventos em diversas cidades onde a congregação mantém escolas e obras sociais.", category: "CATÓLICO", date: "2026-04-17", author: "Equipe de Notícias", featured: false },
  { id: "news-060", title: "Retiro Espiritual Inaciano Atrai Fiéis de Toda a América Latina", excerpt: "Exercícios Espirituais de Santo Inácio reúnem participantes internacionais.", content: "Um grande retiro espiritual inaciano realizado em Belo Horizonte atraiu participantes de mais de dez países latino-americanos, consolidando a tradição jesuítica de formação espiritual.", category: "CATÓLICO", date: "2026-04-16", author: "Equipe de Notícias", featured: false },
  { id: "news-061", title: "Igreja Apoia Campanha de Alfabetização em Comunidades Rurais", excerpt: "Paróquias mobilizam voluntários para ensinar adultos a ler e escrever.", content: "Dezenas de paróquias no interior do Brasil se uniram a uma campanha de alfabetização de adultos em comunidades rurais, combinando missão evangelizadora com transformação social.", category: "CATÓLICO", date: "2026-04-15", author: "Equipe de Notícias", featured: false },
  { id: "news-062", title: "Arquidiocese Inaugura Centro de Acolhida para Imigrantes", excerpt: "Igreja Católica amplia apoio a refugiados e migrantes no Brasil.", content: "A Arquidiocese de São Paulo inaugurou um novo centro de acolhida para imigrantes e refugiados, oferecendo assistência jurídica, psicológica e espiritual às famílias em situação de vulnerabilidade.", category: "CATÓLICO", date: "2026-04-14", author: "Equipe de Notícias", featured: false },
  { id: "news-063", title: "Festa de Corpus Christi Mobiliza Cidades com Tapetes Tradicionais", excerpt: "Celebração eucarística reúne comunidades em torno da fé e da arte popular.", content: "A festa de Corpus Christi mobilizou comunidades em todo o Brasil na confecção dos tradicionais tapetes de serragem, expressando a fé popular católica na Eucaristia.", category: "CATÓLICO", date: "2026-04-13", author: "Equipe de Notícias", featured: false },
  { id: "news-064", title: "Franciscanos Lançam Projeto de Ecologia Integral", excerpt: "Ordem segue ensinamentos da Laudato Si no cuidado com a criação.", content: "A Ordem dos Frades Menores lançou um projeto nacional de ecologia integral inspirado na encíclica Laudato Si do Papa Francisco, envolvendo comunidades em práticas sustentáveis.", category: "CATÓLICO", date: "2026-04-12", author: "Equipe de Notícias", featured: false },
  { id: "news-065", title: "Jovens Católicos Promovem Missão Urbana nas Periferias", excerpt: "Grupos de evangelização atuam nos bairros mais vulneráveis das grandes cidades.", content: "Grupos de jovens católicos de todo o Brasil realizaram missões urbanas nos bairros periféricos, combinando atividades recreativas, sociais e de evangelização.", category: "CATÓLICO", date: "2026-04-11", author: "Equipe de Notícias", featured: false },
  { id: "news-066", title: "Novo Documento do Vaticano Trata da Inteligência Artificial e Ética", excerpt: "Santa Sé publica orientações para o uso responsável da IA.", content: "O Vaticano publicou um novo documento com orientações éticas sobre o uso da inteligência artificial, abordando temas como dignidade humana, privacidade e o papel da tecnologia na sociedade.", category: "CATÓLICO", date: "2026-04-10", author: "Equipe de Notícias", featured: false },
  { id: "news-067", title: "Catedral da Sé Completa Restauração de seu Órgão Histórico", excerpt: "Instrumento centenário volta a soar na liturgia da catedral paulistana.", content: "A Catedral da Sé de São Paulo concluiu a restauração de seu órgão histórico do século XIX, que voltou a ser usado nas celebrações litúrgicas após anos de silêncio.", category: "CATÓLICO", date: "2026-04-09", author: "Equipe de Notícias", featured: false },
  { id: "news-068", title: "Movimento Católico de Renovação Carismática Celebra Aniversário", excerpt: "RCC comemora décadas de evangelização e renovação espiritual no Brasil.", content: "A Renovação Carismática Católica celebrou seu aniversário no Brasil com um grande encontro nacional que reuniu dezenas de milhares de fiéis em celebrações de louvor e testemunho.", category: "CATÓLICO", date: "2026-04-08", author: "Equipe de Notícias", featured: false },
  { id: "news-069", title: "Seminário Maior Abre Inscrições com Aumento de Vocações", excerpt: "Número de candidatos ao sacerdócio cresce em diversas dioceses.", content: "Diversos seminários maiores do Brasil registraram aumento no número de candidatos ao sacerdócio, sinalizando um crescimento nas vocações religiosas entre os jovens católicos.", category: "CATÓLICO", date: "2026-04-07", author: "Equipe de Notícias", featured: false },
  { id: "news-070", title: "Comunidade Shalom Lança Nova Obra de Assistência Social", excerpt: "Movimento católico expande atuação nas áreas de saúde e educação.", content: "A Comunidade Católica Shalom anunciou a inauguração de uma nova obra de assistência social que atenderá famílias em situação de extrema pobreza com serviços de saúde e educação.", category: "CATÓLICO", date: "2026-04-06", author: "Equipe de Notícias", featured: false },
  { id: "news-071", title: "Papa Nomeia Mulher para Cargo de Chefia em Dicastério Vaticano", excerpt: "Nomeação histórica marca avanço na participação feminina na Igreja.", content: "O Papa Francisco nomeou uma teóloga leiga para um cargo de chefia em um Dicastério do Vaticano, em mais um passo no processo de ampliar a participação das mulheres nas estruturas da Igreja.", category: "CATÓLICO", date: "2026-04-05", author: "Equipe de Notícias", featured: false },
  { id: "news-072", title: "Romaria da Terra Reúne Agricultores e Igreja no Campo", excerpt: "Encontro anual celebra a fé e luta dos trabalhadores rurais.", content: "A Romaria da Terra reuniu milhares de agricultores familiares, missionários e bispos em celebração que combina fé cristã, defesa da terra e justiça social no campo.", category: "CATÓLICO", date: "2026-04-04", author: "Equipe de Notícias", featured: false },
  { id: "news-073", title: "Escola Bíblica Católica Forma Mais de Mil Catequistas", excerpt: "Programa de formação bíblica amplia a qualidade da catequese nas paróquias.", content: "Um programa nacional de formação bíblica para catequistas formou mais de mil novos evangelizadores, capacitados para transmitir o Evangelho com profundidade nas comunidades.", category: "CATÓLICO", date: "2026-04-03", author: "Equipe de Notícias", featured: false },
  { id: "news-074", title: "Irmãs Missionárias Iniciam Trabalho em Aldeias Indígenas", excerpt: "Congregação religiosa leva atendimento de saúde e educação a populações remotas.", content: "Um grupo de irmãs missionárias iniciou trabalho pastoral e humanitário em aldeias indígenas da Amazônia, oferecendo cuidados de saúde, educação e acompanhamento espiritual.", category: "CATÓLICO", date: "2026-04-02", author: "Equipe de Notícias", featured: false },
  { id: "news-075", title: "Peregrinação de Fátima Atrai Brasileiros ao Santuário Português", excerpt: "Grupo numeroso parte do Brasil para celebrar aparições em Portugal.", content: "Um grupo de mais de quinhentos peregrinos brasileiros viajou a Fátima para participar das celebrações das aparições de Nossa Senhora, fortalecendo os laços entre as igrejas brasileira e portuguesa.", category: "CATÓLICO", date: "2026-04-01", author: "Equipe de Notícias", featured: false },
  { id: "news-076", title: "Catequese Online Alcança Meio Milhão de Participantes", excerpt: "Programa digital de preparação sacramental cresce em todo o Brasil.", content: "Um programa nacional de catequese online alcançou a marca de meio milhão de participantes, sendo utilizado em dioceses de todo o Brasil como complemento à formação presencial.", category: "CATÓLICO", date: "2026-03-31", author: "Equipe de Notícias", featured: false },
  { id: "news-077", title: "Encontro de Casais Católicos Reúne Famílias de Vinte Estados", excerpt: "Movimento de casais cristãos promove retiro nacional de fortalecimento familiar.", content: "O maior encontro de casais católicos do Brasil reuniu famílias de vinte estados, com programação de formação espiritual, dinâmicas de casal e celebrações eucarísticas.", category: "CATÓLICO", date: "2026-03-30", author: "Equipe de Notícias", featured: false },
  { id: "news-078", title: "Vaticano Emite Nota sobre Dignidade das Pessoas com Deficiência", excerpt: "Igreja reafirma compromisso com a inclusão e acessibilidade.", content: "O Vaticano publicou uma nota pastoral reafirmando a dignidade inalienável das pessoas com deficiência e o compromisso da Igreja em promover ambientes acessíveis e inclusivos.", category: "CATÓLICO", date: "2026-03-29", author: "Equipe de Notícias", featured: false },
  { id: "news-079", title: "Catedral de Brasília Celebra Cinquenta Anos de Sua Inauguração", excerpt: "Marco arquitetônico e espiritual da capital federal completa meio século.", content: "A Catedral Metropolitana Nossa Senhora Aparecida de Brasília celebrou cinquenta anos de sua inauguração com uma série de eventos culturais, espirituais e artísticos.", category: "CATÓLICO", date: "2026-03-28", author: "Equipe de Notícias", featured: false },
  { id: "news-080", title: "Diocese Cria Fundo de Apoio a Padres em Situação de Vulnerabilidade", excerpt: "Igreja cuida do bem-estar de seus ministros em dificuldades.", content: "Uma diocese pioneira criou um fundo especial para apoiar sacerdotes idosos, enfermos ou em situação de vulnerabilidade econômica, garantindo assistência digna aos seus ministros.", category: "CATÓLICO", date: "2026-03-27", author: "Equipe de Notícias", featured: false },
  { id: "news-081", title: "Novas Vocações Religiosas Contemplativas Crescem no Brasil", excerpt: "Mosteiros e conventos relatam aumento no número de novos candidatos.", content: "Mosteiros e conventos de vida contemplativa no Brasil relataram um aumento significativo no número de candidatos à vida religiosa, especialmente entre jovens de 20 a 35 anos.", category: "CATÓLICO", date: "2026-03-26", author: "Equipe de Notícias", featured: false },
  { id: "news-082", title: "Conferência sobre Bioética Reúne Teólogos e Médicos Católicos", excerpt: "Igreja e ciência dialogam sobre desafios éticos da medicina contemporânea.", content: "Uma conferência internacional sobre bioética reuniu teólogos, médicos e filósofos católicos para debater os desafios éticos impostos pelos avanços da medicina e da biotecnologia.", category: "CATÓLICO", date: "2026-03-25", author: "Equipe de Notícias", featured: false },
  { id: "news-083", title: "Paróquia Transforma Antigo Depósito em Centro Cultural Comunitário", excerpt: "Iniciativa paroquial une fé, arte e serviço à comunidade.", content: "Uma paróquia em São Paulo transformou um espaço ocioso em um vibrante centro cultural comunitário, oferecendo cursos, exposições e acolhida a moradores do bairro.", category: "CATÓLICO", date: "2026-03-24", author: "Equipe de Notícias", featured: false },
  { id: "news-084", title: "Assembleia de Deus Lança Maior Campanha de Evangelização da História", excerpt: "Igreja pentecostal mobiliza milhões em ação missionária nacional.", content: "A Assembleia de Deus do Brasil anunciou sua maior campanha de evangelização da história, mobilizando igrejas em todos os estados com mutirões de testemunho e distribuição de Bíblias.", category: "EVANGÉLICO", date: "2026-04-25", author: "Equipe de Notícias", featured: false },
  { id: "news-085", title: "Igreja Batista Inaugura Centro de Formação Teológica no Norte do Brasil", excerpt: "Seminário amplia acesso à educação ministerial na Amazônia.", content: "A Igreja Batista inaugurou um novo centro de formação teológica em Manaus, oferecendo cursos presenciais e online para líderes e pastores da região amazônica.", category: "EVANGÉLICO", date: "2026-04-24", author: "Equipe de Notícias", featured: false },
  { id: "news-086", title: "Congresso de Jovens Evangélicos Reúne Cem Mil em São Paulo", excerpt: "Evento de adoração e formação atrai juventude de todo o país.", content: "O maior congresso evangélico de jovens do Brasil reuniu cem mil participantes em São Paulo para dias intensos de adoração, pregação bíblica e formação ministerial.", category: "EVANGÉLICO", date: "2026-04-23", author: "Equipe de Notícias", featured: false },
  { id: "news-087", title: "Pastor Brasileiro Lidera Missão de Plantio de Igrejas na África", excerpt: "Missionário atua em países africanos de língua portuguesa.", content: "Um pastor evangélico brasileiro lidera um esforço missionário de plantio de igrejas em países africanos de língua portuguesa, com dezenas de novas congregações estabelecidas nos últimos anos.", category: "EVANGÉLICO", date: "2026-04-22", author: "Equipe de Notícias", featured: false },
  { id: "news-088", title: "Igreja Presbiteriana Debate Papel das Mulheres no Ministério", excerpt: "Denominação histórica revisita sua posição sobre ordenação feminina.", content: "A Igreja Presbiteriana do Brasil realizou um sínodo extraordinário para debater o papel das mulheres no ministério pastoral, em um processo de discernimento que envolve toda a denominação.", category: "EVANGÉLICO", date: "2026-04-21", author: "Equipe de Notícias", featured: false },
  { id: "news-089", title: "Aliança Evangélica Brasileira Promove Diálogo entre Denominações", excerpt: "Entidade reúne líderes de diferentes tradições cristãs.", content: "A Aliança Evangélica Brasileira promoveu um encontro histórico de líderes de diversas denominações protestantes e pentecostais, fortalecendo a unidade evangélica no Brasil.", category: "EVANGÉLICO", date: "2026-04-20", author: "Equipe de Notícias", featured: false },
  { id: "news-090", title: "Grupo de Oração Evangélico Passa Noite em Vigília pelo Brasil", excerpt: "Movimento de intercessão mobiliza igrejas de todo o país.", content: "Um movimento nacional de intercessão mobilizou igrejas evangélicas de todo o Brasil para uma vigília de oração durante toda a noite, clamando por avivamento e transformação social.", category: "EVANGÉLICO", date: "2026-04-19", author: "Equipe de Notícias", featured: false },
  { id: "news-091", title: "Escola Dominical Evangélica Moderniza Currículo com Recursos Digitais", excerpt: "Igrejas atualizam ensino bíblico com ferramentas tecnológicas.", content: "Igrejas evangélicas de todo o Brasil estão atualizando seus programas de escola dominical com recursos digitais interativos, tornando o ensino bíblico mais dinâmico para crianças e jovens.", category: "EVANGÉLICO", date: "2026-04-18", author: "Equipe de Notícias", featured: false },
  { id: "news-092", title: "Conferência sobre Reforma Protestante Reúne Acadêmicos e Pastores", excerpt: "Evento celebra e estuda o legado dos reformadores do século XVI.", content: "Uma conferência internacional sobre a Reforma Protestante reuniu acadêmicos, historiadores e pastores para estudar o legado de Lutero, Calvino e outros reformadores.", category: "EVANGÉLICO", date: "2026-04-17", author: "Equipe de Notícias", featured: false },
  { id: "news-093", title: "Programa de Dízimo Solidário Arrecada Fundos para Áreas de Risco", excerpt: "Igrejas evangélicas canalizam recursos para vítimas de desastres.", content: "Um programa de dízimo solidário articulado por igrejas evangélicas arrecadou recursos significativos para apoiar famílias afetadas por enchentes e deslizamentos no sul do país.", category: "EVANGÉLICO", date: "2026-04-16", author: "Equipe de Notícias", featured: false },

  { id: "news-145", title: "Seminário Aberto sobre Apologética Cristã Atrai Público Misto", excerpt: "Evento ensina a defender e explicar a fé com razões sólidas.", content: "Um seminário aberto sobre apologética cristã reuniu crentes de diversas tradições para aprender a defender e explicar a fé com argumentos racionais sólidos diante dos desafios contemporâneos.", category: "AMBOS", date: "2026-03-28", author: "Equipe de Notícias", featured: false },
  { id: "news-146", title: "Cristãos Negros Realizam Encontro de Identidade e Fé", excerpt: "Evento celebra a contribuição afro-brasileira ao cristianismo nacional.", content: "Um encontro de cristãos negros reuniu fiéis de diversas tradições para celebrar a contribuição afro-brasileira ao cristianismo nacional e debater temas de identidade, dignidade e missão.", category: "AMBOS", date: "2026-03-27", author: "Equipe de Notícias", featured: false },
  { id: "news-147", title: "Igrejas Criam Grupos de Apoio para Cristãos com Depressão", excerpt: "Saúde mental ganha espaço nas comunidades de fé brasileiras.", content: "Igrejas de diversas denominações estão criando grupos de apoio para fiéis que enfrentam depressão e ansiedade, reconhecendo a importância da saúde mental como parte do cuidado pastoral integral.", category: "AMBOS", date: "2026-03-26", author: "Equipe de Notícias", featured: false },
  { id: "news-148", title: "Teologia da Prosperidade em Debate nas Igrejas Brasileiras", excerpt: "Líderes cristãos revisitam a pregação sobre bênçãos materiais.", content: "Um debate crescente sobre os limites da teologia da prosperidade está se espalhando pelas igrejas brasileiras, com líderes de diversas denominações buscando um equilíbrio bíblico sobre fé e bênçãos.", category: "AMBOS", date: "2026-03-25", author: "Equipe de Notícias", featured: false },
  { id: "news-149", title: "Grupo de Teatro Cristão Leva Evangelismo às Praças Públicas", excerpt: "Arte dramática como ferramenta de missão e testemunho.", content: "Um grupo de teatro cristão formado por voluntários de diversas igrejas leva espetáculos evangelísticos às praças públicas e centros comunitários, alcançando pessoas que raramente entrariam numa igreja.", category: "AMBOS", date: "2026-03-24", author: "Equipe de Notícias", featured: false },
  { id: "news-150", title: "Declaração dos Direitos Humanos Ganha Leitura Cristã em Seminário", excerpt: "Teólogos debatem o fundamento cristão para a dignidade humana universal.", content: "Um seminário interdenominacional debateu o fundamento cristão para os direitos humanos universais, argumentando que a dignidade de cada ser humano encontra seu alicerce na imagem de Deus.", category: "AMBOS", date: "2026-03-23", author: "Equipe de Notícias", featured: false },
  { id: "news-151", title: "Comunidade Judaica do Brasil Celebra Pessach com Récord de Participantes", excerpt: "Celebrações da Páscoa judaica reúnem famílias de todo o país.", content: "A comunidade judaica brasileira registrou um número recorde de participantes nas celebrações do Pessach, com séders realizados em sinagogas e lares de São Paulo, Rio de Janeiro e outras cidades.", category: "JUDAICO", date: "2026-04-25", author: "Equipe de Noticias", featured: false },
  { id: "news-152", title: "Rabi Chefe de Israel Visita Comunidades Judaicas no Brasil", excerpt: "Liderança religiosa israelense fortalece laços com a diáspora brasileira.", content: "O Rabi Chefe de Israel realizou visita oficial às principais comunidades judaicas do Brasil, promovendo encontros de estudo, fortalecendo os laços com a diáspora e participando de celebrações litúrgicas.", category: "JUDAICO", date: "2026-04-24", author: "Equipe de Noticias", featured: false },
  { id: "news-153", title: "Escola Judaica em São Paulo Celebra Cem Anos de Educação", excerpt: "Instituição educacional secular e religiosa completa um século de história.", content: "A Escola Judaica de São Paulo celebrou seu centenário com uma série de eventos culturais, religiosos e acadêmicos, reconhecendo sua contribuição para a formação de gerações de judeus brasileiros.", category: "JUDAICO", date: "2026-04-23", author: "Equipe de Noticias", featured: false },
  { id: "news-154", title: "Festival de Cultura Judaica Reúne Arte, Música e Espiritualidade", excerpt: "Evento multicultural celebra a riqueza da herança judaica.", content: "O Festival Internacional de Cultura Judaica reuniu artistas, músicos, escritores e estudiosos para celebrar a riqueza da herança cultural e espiritual do povo judeu em todas as suas vertentes.", category: "JUDAICO", date: "2026-04-22", author: "Equipe de Noticias", featured: false },
  { id: "news-155", title: "Sinagoga Histórica de Porto Alegre Conclui Restauração", excerpt: "Patrimônio arquitetônico e espiritual judaico é preservado no sul do Brasil.", content: "A sinagoga histórica de Porto Alegre, uma das mais antigas do Brasil, concluiu um processo de restauração que preservou seus elementos arquitetônicos originais e renovou seus espaços litúrgicos.", category: "JUDAICO", date: "2026-04-21", author: "Equipe de Noticias", featured: false },
  { id: "news-156", title: "Jovens Judeus Brasileiros Participam de Programa em Israel", excerpt: "Taglit-Birthright leva jovens da diáspora ao encontro de suas raízes.", content: "Centenas de jovens judeus brasileiros participaram do programa Taglit-Birthright em Israel, fortalecendo sua identidade judaica e os laços com o Estado de Israel e sua história.", category: "JUDAICO", date: "2026-04-20", author: "Equipe de Noticias", featured: false },
  { id: "news-157", title: "Museu Judaico do Rio de Janeiro Inaugura Nova Exposição Permanente", excerpt: "Acervo sobre a história dos judeus no Brasil ganha nova apresentação.", content: "O Museu Judaico do Rio de Janeiro inaugurou uma nova exposição permanente que narra a trajetória da comunidade judaica no Brasil desde os primeiros conversos até os dias atuais.", category: "JUDAICO", date: "2026-04-19", author: "Equipe de Noticias", featured: false },
  { id: "news-158", title: "Aliança Israelita Universal Abre Novo Centro Cultural em São Paulo", excerpt: "Organização centenária expande sua presença no Brasil com espaço cultural.", content: "A Aliança Israelita Universal inaugurou um novo centro cultural em São Paulo dedicado à promoção da cultura, língua e tradições judaicas para membros da comunidade e para o público em geral.", category: "JUDAICO", date: "2026-04-18", author: "Equipe de Noticias", featured: false },
  { id: "news-159", title: "Rabinos Brasileiros Debatem Bioética à Luz da Halacá", excerpt: "Encontro halachico aborda desafios médicos contemporâneos.", content: "Um encontro de rabinos brasileiros das tradições ashkenazita, sefardita e conservadora debateu questões de bioética à luz da Halacá, buscando orientações para casos médicos complexos.", category: "JUDAICO", date: "2026-04-17", author: "Equipe de Noticias", featured: false },
  { id: "news-160", title: "Comunidade Judaica Lança Projeto de Apoio a Idosos Solitários", excerpt: "Iniciativa combate o isolamento de judeus idosos nas grandes cidades.", content: "Um projeto comunitário lançado pelas principais organizações judaicas brasileiras oferece visitas, refeições e atividades para idosos judeus que vivem sozinhos nas grandes cidades.", category: "JUDAICO", date: "2026-04-16", author: "Equipe de Noticias", featured: false },
  { id: "news-161", title: "Yeshivá Brasileira Forma Novos Rabinos para a Diáspora", excerpt: "Centro de estudos talmúdicos prepara líderes religiosos para comunidades judaicas.", content: "A principal yeshivá do Brasil formou uma nova turma de rabinos preparados para liderar comunidades judaicas no Brasil e em outros países da América Latina.", category: "JUDAICO", date: "2026-04-15", author: "Equipe de Noticias", featured: false },
  { id: "news-162", title: "Shabat Shalom: Campanha Promove o Descanso Sagrado nas Famílias", excerpt: "Iniciativa incentiva famílias a reconectarem com a tradição do Shabat.", content: "Uma campanha nacional promovida pelas comunidades judaicas brasileiras incentiva famílias a redescobrirem a riqueza espiritual e relacional do Shabat como tempo sagrado de descanso e reunião.", category: "JUDAICO", date: "2026-04-14", author: "Equipe de Noticias", featured: false },
  { id: "news-163", title: "Debate sobre Identidade Judaica Reúne Líderes de Diferentes Correntes", excerpt: "Encontro pluralista aborda quem é judeu no Brasil contemporâneo.", content: "Um encontro histórico reuniu líderes das correntes Ortodoxa, Conservadora, Reformada e Reconstrucionista para debater questões de identidade judaica no contexto brasileiro contemporâneo.", category: "JUDAICO", date: "2026-04-13", author: "Equipe de Noticias", featured: false },
  { id: "news-164", title: "Torá Restaurada é Devolvida à Comunidade após Décadas", excerpt: "Rolo sagrado recuperado retorna ao uso litúrgico na sinagoga.", content: "Um rolo da Torá sobrevivente do Holocausto, que havia sido mantido em museu por décadas, foi devolvido a uma comunidade judaica brasileira numa cerimônia emocionante de restauração e retorno.", category: "JUDAICO", date: "2026-04-12", author: "Equipe de Noticias", featured: false },
  { id: "news-165", title: "Programa de Hebraico Moderno Atrai Não-Judeus no Brasil", excerpt: "Interesse pela língua e cultura israelense cresce entre brasileiros.", content: "Programas de ensino de hebraico moderno promovidos por comunidades judaicas e consulados israelenses estão atraindo um número crescente de brasileiros não-judeus interessados na língua e cultura de Israel.", category: "JUDAICO", date: "2026-04-11", author: "Equipe de Noticias", featured: false },
  { id: "news-166", title: "Comunidade Judaica e Muçulmana Unem-se em Projeto de Diálogo", excerpt: "Iniciativa inter-religiosa promove encontro entre as duas tradições abraâmicas.", content: "Uma iniciativa pioneira reúne membros da comunidade judaica e muçulmana brasileira em diálogos regulares, visando construir pontes de entendimento e cooperação entre as duas tradições.", category: "JUDAICO", date: "2026-04-10", author: "Equipe de Noticias", featured: false },
  { id: "news-167", title: "Estudantes Judeus Fundam Organização de Responsabilidade Social", excerpt: "Grupo universitário combina identidade judaica e ativismo social.", content: "Estudantes universitários judeus fundaram uma nova organização que combina identidade judaica com ativismo de responsabilidade social, promovendo projetos de voluntariado inspirados pelos valores do Tikkun Olam.", category: "JUDAICO", date: "2026-04-09", author: "Equipe de Noticias", featured: false },
  { id: "news-168", title: "Arquivo Histórico Judaico Digitaliza Documentos do Século XIX", excerpt: "Acervo raro sobre a imigração judaica ao Brasil é preservado digitalmente.", content: "O Arquivo Histórico Judaico Brasileiro concluiu a digitalização de milhares de documentos raros sobre a imigração judaica ao Brasil no século XIX, disponibilizando-os gratuitamente online.", category: "JUDAICO", date: "2026-04-08", author: "Equipe de Noticias", featured: false },
  { id: "news-169", title: "Rosh Hashaná Reúne Milhares em Celebrações pelo Brasil", excerpt: "Ano Novo judaico é comemorado com serviços religiosos e reuniões familiares.", content: "O Rosh Hashaná reuniu milhares de judeus brasileiros em sinagogas de todo o país para os serviços do Ano Novo judaico, com destaque para a cerimônia do toque do shofar e a leitura da Torá.", category: "JUDAICO", date: "2026-04-07", author: "Equipe de Noticias", featured: false },
  { id: "news-170", title: "Organização Judaica Recebe Prêmio Nacional de Direitos Humanos", excerpt: "Entidade é reconhecida por décadas de defesa dos direitos humanos no Brasil.", content: "Uma organização judaica brasileira recebeu o Prêmio Nacional de Direitos Humanos em reconhecimento às suas décadas de atuação na defesa da dignidade humana e no combate ao antissemitismo.", category: "JUDAICO", date: "2026-04-06", author: "Equipe de Noticias", featured: false },
  { id: "news-171", title: "Haggadá em Português é Lançada com Comentários para Brasileiros", excerpt: "Edição bilíngue facilita a celebração do Pessach pelas novas gerações.", content: "Uma nova edição da Haggadá em português, com comentários contextualizados para a realidade brasileira, foi lançada para facilitar a transmissão da tradição do Pessach às novas gerações.", category: "JUDAICO", date: "2026-04-05", author: "Equipe de Noticias", featured: false },
  { id: "news-172", title: "Cantores de Hazanut Reúnem-se em Festival de Música Litúrgica", excerpt: "Arte milenar do canto sinagogal é celebrada e preservada no Brasil.", content: "O primeiro Festival Brasileiro de Hazanut reuniu cantores litúrgicos judeus de todo o país para celebrar e preservar a arte milenar do canto sinagogal em suas diferentes tradições regionais.", category: "JUDAICO", date: "2026-04-04", author: "Equipe de Noticias", featured: false },
  { id: "news-173", title: "Comunidade Judaica de Curitiba Inaugura Novo Centro Comunitário", excerpt: "Cidade paranaense ganha espaço moderno para vida judaica organizada.", content: "A comunidade judaica de Curitiba inaugurou um novo centro comunitário moderno que concentra a sinagoga, escola, espaços de cultura e serviços sociais em um único complexo integrado.", category: "JUDAICO", date: "2026-04-03", author: "Equipe de Noticias", featured: false },
  { id: "news-174", title: "Jovens Judeus Participam de Projeto de Imersão Cultural no Brasil", excerpt: "Programa fortalece a identidade judaica de jovens da diáspora americana.", content: "Um programa de imersão cultural trouxe jovens judeus norte-americanos ao Brasil para conhecer a comunidade judaica brasileira e explorar as raízes históricas dos judeus na América do Sul.", category: "JUDAICO", date: "2026-04-02", author: "Equipe de Noticias", featured: false },
  { id: "news-175", title: "Seminário sobre Holocausto Reúne Educadores de Todo o Brasil", excerpt: "Formação de professores para transmissão da memória do Shoá.", content: "Um seminário nacional reuniu educadores de todo o Brasil para discutir metodologias de ensino sobre o Holocausto, preparando professores para transmitir essa memória fundamental às novas gerações.", category: "JUDAICO", date: "2026-04-01", author: "Equipe de Noticias", featured: false },
  { id: "news-176", title: "Movimento Sionista Celebra Aniversário do Estado de Israel", excerpt: "Diáspora brasileira comemora a fundação do Estado judeu moderno.", content: "A comunidade judaica brasileira realizou celebrações em todas as principais cidades do país para comemorar o aniversário da fundação do Estado de Israel, com discursos, música e cerimônias.", category: "JUDAICO", date: "2026-03-31", author: "Equipe de Noticias", featured: false },
  { id: "news-177", title: "Organização Beneficente Judaica Amplia Atendimento a Não-Judeus", excerpt: "Entidade expande seus serviços de assistência social para toda a comunidade.", content: "Uma das maiores organizações beneficentes judaicas do Brasil anunciou a expansão de seus serviços de assistência social para atender também famílias não-judaicas em situação de vulnerabilidade.", category: "JUDAICO", date: "2026-03-30", author: "Equipe de Noticias", featured: false },
  { id: "news-178", title: "Mikvê Moderno é Inaugurado em Comunidade Paulistana", excerpt: "Espaço de purificação ritual é renovado com instalações contemporâneas.", content: "Uma comunidade judaica de São Paulo inaugurou um mikvê moderno com instalações contemporâneas, tornando acessível a prática da imersão ritual a membros da comunidade e convertidos.", category: "JUDAICO", date: "2026-03-29", author: "Equipe de Noticias", featured: false },
  { id: "news-179", title: "Livro sobre Filosofia Judaica Medieval Vira Bestseller no Brasil", excerpt: "Obra sobre Maimônides atrai leitores além da comunidade judaica.", content: "Um livro sobre a filosofia judaica medieval de Maimônides, escrito por um rabino brasileiro, tornou-se bestseller de filosofia no Brasil, atraindo leitores muito além das fronteiras da comunidade judaica.", category: "JUDAICO", date: "2026-03-28", author: "Equipe de Noticias", featured: false },
  { id: "news-180", title: "Programa de Conversão ao Judaísmo Cresce nas Comunidades Brasileiras", excerpt: "Interesse crescente pelo judaísmo entre brasileiros não-judeus.", content: "Os programas de giyur, conversão ao judaísmo, registraram aumento significativo de candidatos no Brasil, com pessoas de diversas origens buscando se integrar ao povo e às tradições judaicas.", category: "JUDAICO", date: "2026-03-27", author: "Equipe de Noticias", featured: false },
  { id: "news-181", title: "Patriarca Ecumênico Visita Comunidades Ortodoxas na América do Sul", excerpt: "Liderança espiritual ortodoxa reforça laços com a diáspora sul-americana.", content: "O Patriarca Ecumênico de Constantinopla realizou visita pastoral às comunidades ortodoxas da América do Sul, celebrando a Divina Liturgia e promovendo encontros com líderes das diferentes jurisdições.", category: "ORTODOXO", date: "2026-04-25", author: "Equipe de Noticias", featured: false },
  { id: "news-182", title: "Pascha Ortodoxa Reúne Fiéis em Celebrações de Ressurreição", excerpt: "A Páscoa ortodoxa é celebrada com grande participação no Brasil.", content: "As celebrações da Pascha ortodoxa reuniram fiéis de diversas tradições — grega, russa, antioquena, romena, sérvia e ucraniana — em igrejas de todo o Brasil na noite mais sagrada do ano cristão.", category: "ORTODOXO", date: "2026-04-24", author: "Equipe de Noticias", featured: false },
  { id: "news-183", title: "Igreja Ortodoxa Grega no Brasil Celebra Centenário", excerpt: "Diocese grega comemora cem anos de presença espiritual no Brasil.", content: "A Diocese Ortodoxa Grega do Brasil celebrou seu centenário com uma série de eventos litúrgicos, culturais e comemorativos, reconhecendo a contribuição da imigração grega para a Igreja ortodoxa brasileira.", category: "ORTODOXO", date: "2026-04-23", author: "Equipe de Noticias", featured: false },
  { id: "news-184", title: "Mosteiro Ortodoxo no Interior de São Paulo Atrai Peregrinos", excerpt: "Comunidade monástica torna-se centro de espiritualidade e retiro.", content: "Um mosteiro ortodoxo fundado no interior do estado de São Paulo tornou-se um crescente centro de peregrinação e retiro espiritual, atraindo fiéis ortodoxos e pessoas de outras tradições.", category: "ORTODOXO", date: "2026-04-22", author: "Equipe de Noticias", featured: false },
  { id: "news-185", title: "Exposição de Ícones Ortodoxos Percorre Museus Brasileiros", excerpt: "Arte sacra ortodoxa é apresentada ao público brasileiro em tournê cultural.", content: "Uma exposição de ícones ortodoxos raros, cedidos por igrejas e coleções particulares da Grécia e da Rússia, percorre os principais museus brasileiros, apresentando a teologia visual da Igreja do Oriente.", category: "ORTODOXO", date: "2026-04-21", author: "Equipe de Noticias", featured: false },
  { id: "news-186", title: "Semana de Estudos Patrísticos Reúne Teólogos Ortodoxos e Católicos", excerpt: "Diálogo ecumênico aprofunda o estudo dos Padres da Igreja.", content: "Uma semana de estudos patrísticos reuniu teólogos ortodoxos e católicos para o estudo conjunto dos Padres da Igreja, aprofundando o diálogo ecumênico com base nas fontes comuns da tradição cristã.", category: "ORTODOXO", date: "2026-04-20", author: "Equipe de Noticias", featured: false },
  { id: "news-187", title: "Igreja Ortodoxa Russa Consagra Nova Catedral em São Paulo", excerpt: "Comunidade russa celebra construção de imponente templo na capital paulista.", content: "A Igreja Ortodoxa Russa consagrou uma nova catedral em São Paulo, obra de arte arquitetônica que se tornou o maior templo ortodoxo da América Latina, com capacidade para mil fiéis.", category: "ORTODOXO", date: "2026-04-19", author: "Equipe de Noticias", featured: false },
  { id: "news-188", title: "Jovens Ortodoxos do Brasil Participam de Encontro Pan-Ortodoxo", excerpt: "Juventude de diferentes tradições ortodoxas se reúne no Brasil.", content: "O primeiro Encontro Pan-Ortodoxo de Jovens do Brasil reuniu representantes das comunidades grega, russa, antioquena, romena, sérvia e ucraniana para fortalecer a identidade ortodoxa entre as novas gerações.", category: "ORTODOXO", date: "2026-04-18", author: "Equipe de Noticias", featured: false },
  { id: "news-189", title: "Coral Ortodoxo Lança CD com Cantos Litúrgicos em Português", excerpt: "Tradição coral ortodoxa ganha versão em português brasileiro.", content: "O coral de uma paróquia ortodoxa de São Paulo lançou um álbum com cantos litúrgicos tradicionais da Divina Liturgia adaptados ao português brasileiro, tornando acessível o testemunho musical ortodoxo.", category: "ORTODOXO", date: "2026-04-17", author: "Equipe de Noticias", featured: false },
  { id: "news-190", title: "Colóquio Sobre Hesicasmo Atrai Estudiosos de Três Continentes", excerpt: "Conferência internacional explora a tradição contemplativa ortodoxa.", content: "Um colóquio internacional sobre hesicasmo, a tradição contemplativa ortodoxa, atraiu pesquisadores de universidades da Europa, América e Oriente Médio ao Brasil para apresentação de estudos e diálogo.", category: "ORTODOXO", date: "2026-04-16", author: "Equipe de Noticias", featured: false },
  { id: "news-191", title: "Escola de Teologia Ortodoxa Abre Novo Programa de Mestrado", excerpt: "Formação teológica ortodoxa é aprofundada no Brasil.", content: "A escola de teologia ortodoxa de São Paulo anunciou a abertura de um novo programa de mestrado em teologia ortodoxa, o primeiro da América Latina credenciado pelo Patriarcado Ecumênico.", category: "ORTODOXO", date: "2026-04-15", author: "Equipe de Noticias", featured: false },
  { id: "news-192", title: "Diálogo Teológico Entre Igreja Ortodoxa e Católica Avança no Brasil", excerpt: "Comissão mista publica documento sobre ecumenismo e eucaristia.", content: "A comissão de diálogo teológico entre a Igreja Ortodoxa e a Igreja Católica no Brasil publicou um documento conjunto sobre questões eucarísticas, marcando avanço significativo nas relações entre as duas igrejas.", category: "ORTODOXO", date: "2026-04-14", author: "Equipe de Noticias", featured: false },
  { id: "news-193", title: "Comunidade Ortodoxa Antioquena Celebra Expansão no Brasil", excerpt: "Igreja de origem árabe cresce entre brasileiros convertidos.", content: "A Diocese Ortodoxa Antioquena do Brasil celebrou a expansão de sua presença com a inauguração de três novas paróquias, principalmente composta por brasileiros convertidos à fé ortodoxa.", category: "ORTODOXO", date: "2026-04-13", author: "Equipe de Noticias", featured: false },
  { id: "news-194", title: "Teólogo Ortodoxo Brasileiro Recebe Doutorado Honoris Causa", excerpt: "Acadêmico é reconhecido por contribuição ao diálogo inter-religioso.", content: "Um teólogo ortodoxo brasileiro recebeu o título de Doutor Honoris Causa de uma universidade grega em reconhecimento à sua contribuição acadêmica ao diálogo inter-religioso e à teologia ortodoxa.", category: "ORTODOXO", date: "2026-04-12", author: "Equipe de Noticias", featured: false },
  { id: "news-195", title: "Grandes Quaresma Ortodoxa: Igrejas Abrem Serviços Especiais", excerpt: "Período quaresmal atrai fiéis a celebrações da liturgia pré-santificada.", content: "As igrejas ortodoxas do Brasil abriram séries de serviços especiais da Grande Quaresma, incluindo a Liturgia dos Dons Pré-Santificados, o Cânon de São André de Creta e os Akathístos.", category: "ORTODOXO", date: "2026-04-11", author: "Equipe de Noticias", featured: false },
  { id: "news-196", title: "Restauração de Igreja Ortodoxa Histórica é Concluída em Curitiba", excerpt: "Templo do início do século XX recupera sua beleza original.", content: "Uma igreja ortodoxa histórica de Curitiba, construída pelos primeiros imigrantes ucranianos no início do século XX, concluiu um processo de restauração que recuperou seus afrescos originais e sua estrutura arquitetônica.", category: "ORTODOXO", date: "2026-04-10", author: "Equipe de Noticias", featured: false },
  { id: "news-197", title: "Missão Ortodoxa Leva Evangelismo às Comunidades Carentes", excerpt: "Paróquia urbana combina liturgia e serviço social nas periferias.", content: "Uma paróquia ortodoxa de São Paulo iniciou um programa de missão urbana que combina celebrações litúrgicas regulares com serviços de assistência social em comunidades carentes das periferias da cidade.", category: "ORTODOXO", date: "2026-04-09", author: "Equipe de Noticias", featured: false },
  { id: "news-198", title: "Patriarcado de Moscou e Constantinopla Promovem Reconciliação no Brasil", excerpt: "Jurisdições ortodoxas buscam superar divisões históricas.", content: "Representantes do Patriarcado de Moscou e de Constantinopla realizaram encontros no Brasil visando a reconciliação entre as duas jurisdições e a promoção da unidade pan-ortodoxa no país.", category: "ORTODOXO", date: "2026-04-08", author: "Equipe de Noticias", featured: false },
  { id: "news-199", title: "Música Litúrgica Ortodoxa Entra em Plataformas de Streaming", excerpt: "Cantos sagrados ortodoxos alcançam novo público através da internet.", content: "Gravações de música litúrgica ortodoxa de igrejas brasileiras alcançaram expressivo número de acessos em plataformas de streaming, apresentando a beleza do canto sagrado oriental a ouvintes de todo o mundo.", category: "ORTODOXO", date: "2026-04-07", author: "Equipe de Noticias", featured: false },
  { id: "news-200", title: "Iconografista Brasileira Expõe Ícones em Galeria Internacional", excerpt: "Artista sacra ortodoxa é reconhecida além das fronteiras confessionais.", content: "Uma iconografista brasileira formada na tradição ortodoxa expôs seu trabalho em uma galeria de arte sacra internacional, recebendo reconhecimento por sua técnica rigorosa e profundidade espiritual.", category: "ORTODOXO", date: "2026-04-06", author: "Equipe de Noticias", featured: false },
  { id: "news-201", title: "Igreja Ortodoxa Romena Inaugura Nova Paróquia em Florianópolis", excerpt: "Comunidade de descendentes de romenos organiza vida litúrgica no sul.", content: "A Igreja Ortodoxa Romena inaugurou uma nova paróquia em Florianópolis, atendendo à crescente comunidade de descendentes de imigrantes romenos que buscam manter suas raízes espirituais e culturais.", category: "ORTODOXO", date: "2026-04-05", author: "Equipe de Noticias", featured: false },
  { id: "news-202", title: "Seminaristas Ortodoxos Brasileiros Estudam em Atenas e Moscou", excerpt: "Formação clerical ortodoxa é fortalecida com intercâmbio internacional.", content: "Jovens seminaristas ortodoxos brasileiros partiram para programas de formação teológica em Atenas e Moscou, fortalecendo os laços com as igrejas-mãe e aprofundando sua preparação ministerial.", category: "ORTODOXO", date: "2026-04-04", author: "Equipe de Noticias", featured: false },
  { id: "news-203", title: "Natal Ortodoxo Reúne Fiéis em Celebrações de 7 de Janeiro", excerpt: "Igrejas orientais celebram o Natal conforme o calendário juliano.", content: "As igrejas ortodoxas que seguem o calendário juliano celebraram o Natal em 7 de janeiro com serviços litúrgicos, procissões e reuniões comunitárias que uniram fé e identidade cultural.", category: "ORTODOXO", date: "2026-04-03", author: "Equipe de Noticias", featured: false },

  { id: "news-205", title: "Igreja Ortodoxa Sérvia Celebra Slava em Comunidades Brasileiras", excerpt: "Festa patronal sérvia mantém viva a tradição familiar e comunitária.", content: "A Igreja Ortodoxa Sérvia celebrou a Slava, a festa patronal familiar, em comunidades de descendentes de sérvios no Brasil, mantendo viva uma das tradições religiosas e culturais mais características do povo sérvio.", category: "ORTODOXO", date: "2026-04-01", author: "Equipe de Noticias", featured: false },
  { id: "news-206", title: "Biblioteca Teológica Ortodoxa Digital é Lançada em Português", excerpt: "Acervo de textos patrísticos e litúrgicos fica acessível online.", content: "Uma biblioteca digital de textos teológicos ortodoxos em português foi lançada por uma fundação ecumênica, disponibilizando gratuitamente obras dos Padres da Igreja e textos litúrgicos ortodoxos.", category: "ORTODOXO", date: "2026-03-31", author: "Equipe de Noticias", featured: false },

  { id: "news-225", title: "Ordinandos Anglicanos Celebram Ordenação Diaconal e Presbiteral", excerpt: "Novos ministros são consagrados para o serviço na Igreja.", content: "A diocese anglicana de São Paulo celebrou uma cerimônia de ordenação diaconal e presbiteral, consagrando novos ministros para o serviço nas paróquias e missões da diocese.", category: "ANGLICANO", date: "2026-03-28", author: "Equipe de Noticias", featured: false },
  { id: "news-226", title: "Programa Anglicano de Mentoria Espiritual Atinge Mil Participantes", excerpt: "Acompanhamento espiritual individualizado cresce na tradição anglicana.", content: "O programa de direção espiritual e mentoria da Igreja Episcopal Anglicana alcançou a marca de mil participantes, com diretores espirituais treinados oferecendo acompanhamento personalizado a fiéis em toda a diocese.", category: "ANGLICANO", date: "2026-03-26", author: "Equipe de Noticias", featured: false },

        const db = {
            articles: [...newArts, ...(typeof articlesData !== 'undefined' ? articlesData : [])],
            courses: [...newCrs, ...(typeof coursesData !== 'undefined' ? coursesData : []), ...(typeof coupleCoursesData !== 'undefined' ? coupleCoursesData : [])],
            devotionals: (typeof devotionalsData !== 'undefined' ? devotionalsData : []),
            news: (typeof newsData !== 'undefined' ? newsData : [])
        };

        let state = { tab: 'articles', filter: 'TODOS' };

        function setTab(t) {
            state.tab = t;
            document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.id === 'tab-' + t));
            render();
        }

        function setFilter(f) {
            state.filter = f;
            document.querySelectorAll('#filters button').forEach(b => b.classList.toggle('active', b.textContent.toUpperCase() === f));
            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            const status = document.getElementById('status');
            if (!grid) return;
            
            const data = db[state.tab] || [];
            const filtered = data.filter(item => 
                item && (state.filter === 'TODOS' || item.category === state.filter || item.category === 'AMBOS')
            );

            status.textContent = `${filtered.length} itens em ${state.tab.toUpperCase()}`;
            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty">Nenhum conteúdo encontrado.</div>';
                return;
            }

            // Renderização Segura (limite de 200 para performance)
            const html = filtered.slice(0, 200).map(item => `
                <div class="card">
                    <span class="cat">${item.category || 'GERAL'}</span>
                    <h3>${item.title || 'Sem título'}</h3>
                    <p>${(item.excerpt || item.content || '').substring(0, 140)}...</p>
                    <div class="card-ft">
                        <span>${item.author || item.instructor || 'Equipe'}</span>
                        <span style="font-weight:600;color:var(--p)">Ler mais →</span>
                    </div>
                </div>
            `).join('');
            
            grid.innerHTML = html;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        window.onload = render;
    </script>
